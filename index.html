<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Grammar NA021 — 12 chuyên đề</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel-2:#fbfcfe; --text:#1b2033; --muted:#6b7280;
  --brand:#4f46e5; --brand-2:#7c3aed; --brand-soft:#eef0ff;
  --ok:#0ea472; --ok-soft:#e6f7f1; --bad:#e0403f; --bad-soft:#fdeaea;
  --warn:#b7791f; --warn-soft:#fdf6e3;
  --border:#e4e7ef; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --radius:16px;
}
[data-theme="dark"]{
  --bg:#0e1119; --panel:#161b26; --panel-2:#1b2130; --text:#e8ebf2; --muted:#98a2b3;
  --brand:#8b87ff; --brand-2:#b48bff; --brand-soft:#22243a;
  --ok:#34d399; --ok-soft:#12291f; --bad:#f87171; --bad-soft:#2c1416;
  --warn:#fbbf24; --warn-soft:#2a2312;
  --border:#262d3d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
.app{display:grid;grid-template-columns:310px 1fr;min-height:100vh}

/* ============ SIDEBAR ============ */
.sidebar{
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;
}
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--border)}
.brand h1{margin:0;font-size:16px;letter-spacing:.2px}
.brand span{
  display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;color:var(--brand);
  background:var(--brand-soft);padding:3px 9px;border-radius:99px;
}
.search-wrap{padding:14px 16px 8px}
.search{
  width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);font-size:13.5px;outline:none;
}
.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.nav{flex:1;overflow-y:auto;padding:6px 10px 20px}
.nav-item{
  display:flex;gap:11px;align-items:flex-start;padding:10px 11px;border-radius:11px;
  cursor:pointer;border:1px solid transparent;margin-bottom:3px;
  transition:background .15s,border-color .15s;
}
.nav-item:hover{background:var(--panel-2)}
.nav-item.active{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
.nav-num{
  flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-size:12px;font-weight:800;background:var(--panel-2);color:var(--muted);
  border:1px solid var(--border);
}
.nav-item.active .nav-num{background:var(--brand);color:#fff;border-color:transparent}
.nav-item.done .nav-num{background:var(--ok);color:#fff;border-color:transparent}
.nav-txt{flex:1;min-width:0}
.nav-txt b{display:block;font-size:13px;font-weight:650;line-height:1.35}
.nav-txt small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.nav-badge{
  font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;
  background:var(--ok-soft);color:var(--ok);white-space:nowrap;
}
.side-foot{padding:12px 16px 18px;border-top:1px solid var(--border)}
.prog-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.bar{height:7px;border-radius:99px;background:var(--border);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .4s}
.side-actions{display:flex;gap:8px;margin-top:12px}
.btn-mini{
  flex:1;padding:7px 8px;font-size:12px;font-weight:600;border-radius:9px;cursor:pointer;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);
}
.btn-mini:hover{border-color:var(--brand);color:var(--brand)}

/* ============ MAIN ============ */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:11px 28px;display:flex;align-items:center;gap:14px;
}
.topbar .crumb{font-size:12.5px;color:var(--muted);font-weight:600}
.topbar .crumb b{color:var(--text)}
.spacer{flex:1}
.chip{
  font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;
  background:var(--brand-soft);color:var(--brand);border:1px solid transparent;
}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);cursor:pointer;font-size:15px;
  display:grid;place-items:center;
}
.icon-btn:hover{border-color:var(--brand)}
#menuBtn{display:none}

.wrap{padding:26px 28px 90px;max-width:900px;width:100%}
.topic-head{margin-bottom:22px}
.topic-head .kicker{
  font-size:11.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--brand);margin-bottom:6px;
}
.topic-head h2{margin:0 0 6px;font-size:27px;line-height:1.25;letter-spacing:-.4px}
.topic-head .vi{color:var(--muted);font-size:14.5px;margin-bottom:14px}
.head-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.btn{
  padding:8px 15px;font-size:13px;font-weight:650;border-radius:10px;cursor:pointer;
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  transition:.15s;
}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{color:#fff;filter:brightness(1.06)}

.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow);
}
.card h3{
  margin:0 0 14px;font-size:17px;letter-spacing:-.2px;
  padding-bottom:11px;border-bottom:1px solid var(--border);
}
.card h4{margin:18px 0 8px;font-size:14.5px;color:var(--brand)}
.card p{margin:0 0 12px;font-size:14.5px}
.card p:last-child{margin-bottom:0}

.formula{
  display:inline-block;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
  font-size:13.5px;font-weight:600;background:var(--brand-soft);color:var(--brand);
  padding:7px 13px;border-radius:9px;margin:6px 0 12px;
}
table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:13.8px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--panel-2);font-weight:700;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-2)}

.ex{
  border-left:3px solid var(--brand);background:var(--panel-2);
  padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:9px;
}
.ex .en{font-size:14.2px;font-weight:600;margin-bottom:2px}
.ex .en em{color:var(--brand);font-style:normal;font-weight:800}
.ex .vi{font-size:13px;color:var(--muted);font-style:italic}

.note{
  background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);
  border-radius:11px;padding:11px 14px;font-size:13.6px;margin:10px 0;
}
.note b{color:var(--warn)}
.note::before{content:"⚠ "}

ul.list{margin:8px 0 14px;padding-left:20px;font-size:14.2px}
ul.list li{margin-bottom:6px}

/* ============ QUIZ ============ */
.quiz-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.quiz-top{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.quiz-top h3{margin:0;font-size:17px;border:none;padding:0}
.quiz-score{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.quiz-body{padding:8px 24px 24px}
.q{padding:18px 0;border-bottom:1px dashed var(--border)}
.q:last-of-type{border-bottom:none}
.q-text{font-size:14.6px;font-weight:650;margin-bottom:11px;display:flex;gap:9px}
.q-text .qn{
  flex:0 0 22px;height:22px;border-radius:6px;background:var(--brand-soft);color:var(--brand);
  font-size:11.5px;font-weight:800;display:grid;place-items:center;margin-top:2px;
}
.opts{display:grid;gap:7px;padding-left:31px}
.opt{
  text-align:left;padding:9px 13px;border-radius:10px;cursor:pointer;font-size:13.8px;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);
  transition:.13s;font-family:inherit;
}
.opt:hover:not(.locked){border-color:var(--brand);background:var(--brand-soft)}
.opt.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}
.opt.locked{cursor:default}
.explain{
  margin:10px 0 0 31px;padding:10px 13px;border-radius:10px;font-size:13.2px;
  background:var(--panel-2);border:1px dashed var(--border);color:var(--muted);
}
.explain b{color:var(--text)}

.result{
  margin:18px 0 4px;padding:18px;border-radius:13px;text-align:center;
  background:linear-gradient(135deg,var(--brand-soft),transparent);
  border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);
}
.result .big{font-size:32px;font-weight:800;letter-spacing:-1px;color:var(--brand)}
.result .msg{font-size:13.6px;color:var(--muted);margin-top:3px}

/* ============ MISC ============ */
#overlay{display:none}
@media(max-width:960px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:290px;z-index:60;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  #menuBtn{display:grid}
  #overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
  .wrap{padding:20px 16px 80px}
  .topbar{padding:10px 16px}
  .topic-head h2{font-size:22px}
  .card{padding:18px 16px}
  .quiz-top,.quiz-body{padding-left:16px;padding-right:16px}
  .opts{padding-left:0}
  .explain{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>Advanced Grammar</h1>
      <span>NA021 · B1–B2</span>
    </div>
    <div class="search-wrap">
      <input class="search" id="search" placeholder="🔍 Tìm chuyên đề..." autocomplete="off">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="prog-label"><span>Tiến độ tổng</span><span id="progTxt">0/12</span></div>
      <div class="bar"><i id="progBar" style="width:0%"></i></div>
      <div class="side-actions">
        <button class="btn-mini" id="themeBtn">🌙 Tối</button>
        <button class="btn-mini" id="resetBtn">↺ Đặt lại</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn">☰</button>
      <div class="crumb" id="crumb">Chuyên đề</div>
      <div class="spacer"></div>
      <div class="chip" id="topChip">0%</div>
    </header>
    <div class="wrap" id="content"></div>
  </div>
</div>
<div id="overlay"></div>

<script>
/* =====================================================================
   DỮ LIỆU 12 CHUYÊN ĐỀ
   ===================================================================== */
const TOPICS = [
/* ---------------------------------- 1 ---------------------------------- */
{
id:"t1", num:1, icon:"🕐",
title:"Prepositions of Time", vi:"Giới từ chỉ thời gian",
intro:"Giới từ chỉ thời gian diễn tả sự việc xảy ra khi nào, kéo dài bao lâu, bắt đầu từ lúc nào hoặc kết thúc trước thời điểm nào. Trọng tâm: phân biệt AT – ON – IN, BY – UNTIL, FOR – SINCE.",
sections:[
 { h:"1.1. AT, ON và IN",
   blocks:[
    {t:"p", text:"Không nên học thuộc nghĩa tiếng Việt mà cần xác định <b>loại mốc thời gian</b> được nhắc đến: một điểm, một ngày, hay một khoảng."},
    {t:"h4", text:"A. AT — thời điểm cụ thể"},
    {t:"table", head:["Cách dùng","Ví dụ"], rows:[
      ["Giờ cụ thể","at 7 o’clock — lúc 7 giờ"],
      ["Giờ và phút","at 7:30"],
      ["Buổi trưa / nửa đêm","at noon / at midnight"],
      ["Bình minh / hoàng hôn","at dawn / at sunset"],
      ["Ban đêm","at night"],
      ["Thời điểm hiện tại","at the moment"],
      ["Cuối tuần (Anh–Anh)","at the weekend"],
      ["Dịp lễ","at Christmas, at Easter"],
      ["Giờ ăn","at breakfast, at lunchtime"],
      ["Cụm cố định","at present, at the same time"]
    ]},
    {t:"ex", items:[
      {en:"The lesson starts <em>at</em> 8 a.m.", vi:"Buổi học bắt đầu lúc 8 giờ sáng."},
      {en:"I usually study <em>at</em> night.", vi:"Tôi thường học vào ban đêm."},
      {en:"She is busy <em>at</em> the moment.", vi:"Hiện tại cô ấy đang bận."}
    ]},
    {t:"note", text:"<b>at night</b> nói chung về ban đêm; <b>in the night</b> nói về một thời điểm trong một đêm cụ thể."},
    {t:"h4", text:"B. ON — ngày và ngày cụ thể"},
    {t:"table", head:["Cách dùng","Ví dụ"], rows:[
      ["Ngày trong tuần","on Monday"],
      ["Ngày tháng","on 15 May"],
      ["Ngày sinh nhật","on my birthday"],
      ["Ngày lễ cụ thể","on Christmas Day"],
      ["Ngày + buổi","on Monday morning, on Friday evening"],
      ["Cuối tuần (Anh–Mỹ)","on the weekend"]
    ]},
    {t:"ex", items:[
      {en:"We have an English test <em>on</em> Friday.", vi:"Chúng tôi có bài kiểm tra vào thứ Sáu."},
      {en:"I was born <em>on</em> 12 June.", vi:"Tôi sinh ngày 12 tháng 6."}
    ]},
    {t:"note", text:"Khi morning / afternoon / evening đi cùng một ngày cụ thể, dùng <b>on</b>: <i>on Tuesday afternoon</i> (không phải <i>in Tuesday afternoon</i>)."},
    {t:"h4", text:"C. IN — khoảng thời gian tương đối dài"},
    {t:"table", head:["Cách dùng","Ví dụ"], rows:[
      ["Tháng / năm","in October / in 2026"],
      ["Mùa","in summer"],
      ["Thập kỷ / thế kỷ","in the 1990s / in the 21st century"],
      ["Buổi trong ngày","in the morning, in the afternoon, in the evening"],
      ["Một giai đoạn","in the past"],
      ["Khoảng thời gian tính từ hiện tại","in two weeks"]
    ]},
    {t:"ex", items:[
      {en:"I started learning English <em>in</em> 2022.", vi:"Tôi bắt đầu học tiếng Anh vào năm 2022."},
      {en:"The course will finish <em>in</em> December.", vi:"Khóa học sẽ kết thúc vào tháng 12."}
    ]},
    {t:"h4", text:"D. So sánh nhanh"},
    {t:"table", head:["Giới từ","Loại mốc","Ví dụ"], rows:[
      ["AT","Một điểm thời gian","at 6 p.m. · at noon · at midnight"],
      ["ON","Một ngày cụ thể","on Monday · on 1 May · on Sunday morning"],
      ["IN","Một khoảng rộng hơn","in July · in 2026 · in the morning"]
    ]}
   ]},
 { h:"1.2. BY, UNTIL/TILL và DURING",
   blocks:[
    {t:"p", text:"Ba giới từ này thường bị nhầm vì đều xuất hiện trong câu nói về một khoảng thời gian."},
    {t:"h4", text:"A. BY — chậm nhất vào một thời điểm (hạn chót)"},
    {t:"formula", text:"by + time"},
    {t:"ex", items:[
      {en:"You must submit your assignment <em>by</em> Friday.", vi:"Bạn phải nộp bài chậm nhất vào thứ Sáu."},
      {en:"I will have finished the report <em>by</em> 5 p.m.", vi:"Tôi sẽ hoàn thành báo cáo chậm nhất vào 5 giờ chiều."}
    ]},
    {t:"note", text:"<b>By Friday</b> không có nghĩa hành động kéo dài đến thứ Sáu — nó có thể hoàn thành sớm hơn."},
    {t:"h4", text:"B. UNTIL / TILL — cho đến một thời điểm"},
    {t:"ex", items:[
      {en:"I will stay here <em>until</em> 6 p.m.", vi:"Tôi sẽ ở đây đến 6 giờ chiều."},
      {en:"We won’t leave <em>until</em> the teacher arrives.", vi:"Chúng tôi sẽ không rời đi cho đến khi giáo viên đến."}
    ]},
    {t:"p", text:"<b>Till</b> tương đương <b>until</b> và thân mật hơn."},
    {t:"h4", text:"C. Phân biệt BY và UNTIL"},
    {t:"table", head:["BY","UNTIL"], rows:[
      ["Nhấn mạnh hạn chót hoàn thành","Nhấn mạnh sự tiếp diễn đến mốc"],
      ["Finish it by Friday. (hoàn thành chậm nhất thứ Sáu)","Stay here until Friday. (ở lại cho đến thứ Sáu)"]
    ]},
    {t:"ex", items:[
      {en:"Please send me the file <em>by</em> 5 p.m.", vi:"Hãy gửi tệp cho tôi chậm nhất lúc 5 giờ."},
      {en:"I will be in class <em>until</em> 5 p.m.", vi:"Tôi sẽ ở trong lớp đến 5 giờ."}
    ]},
    {t:"h4", text:"D. DURING — trong suốt / vào một thời điểm thuộc sự kiện"},
    {t:"formula", text:"during + noun / noun phrase"},
    {t:"ex", items:[
      {en:"I fell asleep <em>during</em> the film.", vi:"Tôi ngủ quên trong lúc xem phim."},
      {en:"Nobody spoke <em>during</em> the meeting.", vi:"Không ai nói chuyện trong cuộc họp."}
    ]},
    {t:"note", text:"Không dùng during trực tiếp trước mệnh đề: <i>during I was studying</i> ✗ → dùng <b>while I was studying</b> ✓"}
   ]},
 { h:"1.3. FOR, SINCE và FROM…TO/UNTIL",
   blocks:[
    {t:"h4", text:"A. FOR — trong bao lâu"},
    {t:"formula", text:"for + duration"},
    {t:"ex", items:[
      {en:"I have studied English <em>for</em> four years.", vi:"Tôi đã học tiếng Anh được bốn năm."},
      {en:"She waited <em>for</em> twenty minutes.", vi:"Cô ấy đã đợi hai mươi phút."}
    ]},
    {t:"h4", text:"B. SINCE — kể từ một mốc"},
    {t:"formula", text:"have/has + V3 + since + starting point"},
    {t:"ex", items:[
      {en:"I have lived here <em>since</em> 2024.", vi:"Tôi đã sống ở đây kể từ năm 2024."},
      {en:"She has known him <em>since</em> they were children.", vi:"Cô ấy đã biết anh ấy từ khi họ còn nhỏ."}
    ]},
    {t:"h4", text:"C. Phân biệt FOR và SINCE"},
    {t:"table", head:["FOR","SINCE"], rows:[
      ["Nêu khoảng thời gian","Nêu mốc bắt đầu"],
      ["for two years / for a week","since 2024 / since Monday"],
      ["Hỏi <b>How long?</b> → for","Hỏi <b>Since when?</b> → since"]
    ]},
    {t:"h4", text:"D. FROM…TO / UNTIL — từ…đến"},
    {t:"ex", items:[
      {en:"The library is open <em>from</em> 8 a.m. <em>to</em> 5 p.m.", vi:"Thư viện mở cửa từ 8 giờ sáng đến 5 giờ chiều."},
      {en:"I worked <em>from</em> Monday <em>until</em> Friday.", vi:"Tôi làm việc từ thứ Hai đến thứ Sáu."}
    ]},
    {t:"p", text:"<b>From…to</b> nêu cả hai đầu mốc; <b>from…until</b> nhấn mạnh điểm kết thúc."}
   ]},
 { h:"1.4. BEFORE, AFTER, WITHIN, THROUGHT",
   blocks:[
    {t:"h4", text:"BEFORE — trước"},
    {t:"ex", items:[{en:"Finish your homework <em>before</em> dinner.", vi:"Hoàn thành bài tập trước bữa tối."}]},
    {t:"h4", text:"AFTER — sau"},
    {t:"ex", items:[
      {en:"We went for a walk <em>after</em> lunch.", vi:"Chúng tôi đi dạo sau bữa trưa."},
      {en:"<em>After finishing</em> the assignment, she went to bed.", vi:"Sau khi làm xong bài tập, cô ấy đi ngủ."}
    ]},
    {t:"h4", text:"WITHIN — trong vòng, không quá"},
    {t:"ex", items:[
      {en:"Please reply <em>within</em> three days.", vi:"Vui lòng phản hồi trong vòng ba ngày."},

    {t:"note", text:"<b>in three days</b> = sau ba ngày kể từ hiện tại. <b>within three days</b> = vào bất kỳ thời điểm nào trong vòng ba ngày."},
    {t:"h4", text:"THROUGHOUT — xuyên suốt toàn bộ khoảng thời gian"},
    {t:"ex", items:[
      {en:"It rained <em>throughout</em> the night.", vi:"Trời mưa suốt đêm."},
      {en:"He remained calm <em>throughout</em> the interview.", vi:"Anh ấy giữ bình tĩnh trong suốt buổi phỏng vấn."}
    ]}
   ]},
 { h:"1.5. Trường hợp KHÔNG dùng giới từ chỉ thời gian",
   blocks:[
    {t:"table", head:["Từ / cụm từ","Ví dụ đúng"], rows:[
      ["yesterday","yesterday morning"],
      ["today / tomorrow / tonight","today, tomorrow evening, tonight"],
      ["last + thời gian","last week"],
      ["next + thời gian","next month"],
      ["this + thời gian","this Friday"],
      ["every + thời gian","every Monday"],
      ["ago","two years ago"]
    ]},
    {t:"ex", items:[
      {en:"I met her <em>last week</em>.", vi:"Tôi gặp cô ấy tuần trước. (không dùng in last week)"},

title:"Phrasal Verbs", vi:"Cụm động từ",
intro:"Phrasal verbs gồm động từ + tiểu từ, thường tạo nghĩa mới không suy ra được từ từng từ riêng lẻ. Cần nắm 3 loại cấu trúc và quy tắc vị trí tân ngữ.",
sections:[
 { h:"3.1. Ba loại cấu trúc chính",
   blocks:[
    {t:"h4", text:"A. Verb + particle"},

    {t:"table", head:["Cụm động từ","Nghĩa"], rows:[
      ["give up","từ bỏ"],["turn on / turn off","bật / tắt"],
      ["take off","cởi; cất cánh"],["find out","tìm ra, phát hiện"],
      ["bring up","nuôi dưỡng; đề cập"],["put off","trì hoãn"],
      ["carry on","tiếp tục"],["work out","tập luyện; tìm ra lời giải"],
      ["break down","hỏng; suy sụp"]

    {t:"ex", items:[
      {en:"I will never <em>give up</em> learning English.", vi:"Tôi sẽ không bao giờ từ bỏ việc học tiếng Anh."},

    {t:"h4", text:"B. Verb + preposition (tân ngữ đứng ngay sau giới từ)"},

    {t:"ex", items:[
      {en:"She <em>looks after</em> her younger brother.", vi:"Cô ấy chăm sóc em trai."},
      {en:"Success often <em>depends on</em> hard work.", vi:"Thành công thường phụ thuộc vào sự chăm chỉ."}

    {t:"h4", text:"C. Verb + particle + preposition"},

/* ---------------------------------- 4 ---------------------------------- */
{
id:"t4", num:4, icon:"🔤",
title:"Gerunds & Infinitives", vi:"Danh động từ và động từ nguyên mẫu",
intro:"Chuyên đề quan trọng ở B1–B2 vì nhiều động từ yêu cầu dạng theo sau cố định (verb patterns). Trọng tâm: V-ing vs to-V, và các động từ đổi nghĩa.",
sections:[
 { h:"4.1. Gerund — V-ing",
   blocks:[
    {t:"p", text:"Gerund là dạng động từ thêm -ing được dùng ở vị trí giống danh từ."},
    {t:"ex", items:[
      {en:"<em>Swimming</em> is good for your health.", vi:"Bơi lội tốt cho sức khỏe."},
      {en:"I enjoy <em>reading</em>.", vi:"Tôi thích đọc sách."},
      {en:"She is interested in <em>learning</em> English.", vi:"Cô ấy hứng thú với việc học tiếng Anh."}
    ]},
    {t:"note", text:"Gerund và present participle cùng hình thức V-ing nhưng chức năng ngữ pháp khác nhau."}
   ]},
 { h:"4.2. Chức năng của gerund",
   blocks:[
    {t:"h4", text:"A. Làm chủ ngữ"},
    {t:"ex", items:[{en:"<em>Learning</em> English takes time.", vi:"Học tiếng Anh cần thời gian."}]},
    {t:"h4", text:"B. Làm tân ngữ"},
    {t:"ex", items:[{en:"He avoids <em>making</em> mistakes.", vi:"Anh ấy tránh mắc lỗi."}]},
    {t:"h4", text:"C. Làm bổ ngữ"},
    {t:"ex", items:[{en:"My favourite activity is <em>reading</em>.", vi:"Hoạt động yêu thích của tôi là đọc."}]},
    {t:"h4", text:"D. Sau giới từ"},
    {t:"p", text:"Sau giới từ, nếu dùng động từ thì <b>phải dùng V-ing</b>."},
    {t:"table", head:["Cụm","Ví dụ"], rows:[
      ["interested in","interested in learning"],
      ["good at","good at speaking"],
      ["tired of","tired of waiting"],
      ["without","without saying anything"],
      ["before / after","before leaving / after finishing"]
    ]},
    {t:"note", text:"<b>to</b> đôi khi là giới từ, không phải dấu hiệu của to-infinitive: <i>look forward to meeting</i>, <i>be used to getting up</i>, <i>object to paying</i>."}
   ]},
 { h:"4.3. Động từ thường đi với gerund",
   blocks:[
    {t:"table", head:["Động từ","Nghĩa"], rows:[
      ["admit","thừa nhận"],["avoid","tránh"],["consider","cân nhắc"],
      ["deny","phủ nhận"],["enjoy","thích, tận hưởng"],["finish","hoàn thành"],
      ["imagine","tưởng tượng"],["mind","phiền, ngại"],["miss","nhớ; bỏ lỡ"],
      ["postpone","hoãn"],["practise","luyện tập"],["risk","mạo hiểm"],
      ["suggest","đề nghị"],["keep","tiếp tục"],["quit","từ bỏ"]
    ]},
    {t:"ex", items:[
      {en:"She avoids <em>eating</em> late at night.", vi:"Cô ấy tránh ăn muộn."},
      {en:"He suggested <em>taking</em> a taxi.", vi:"Anh ấy đề nghị đi taxi."},
      {en:"Would you mind <em>opening</em> the window?", vi:"Bạn có phiền mở cửa sổ không?"}
    ]},
    {t:"note", text:"Không dùng to-infinitive trực tiếp sau các động từ này: <i>enjoy to read</i> ✗, <i>suggest to go</i> ✗"}
   ]},
 { h:"4.4. To-infinitive — to + V",
   blocks:[
    {t:"table", head:["Động từ","Ví dụ"], rows:[
      ["agree","agree to help"],["afford","afford to buy"],["decide","decide to leave"],
      ["expect","expect to win"],["hope","hope to succeed"],["learn","learn to drive"],
      ["manage","manage to finish"],["offer","offer to help"],["plan","plan to study"],
      ["promise","promise to return"],["refuse","refuse to answer"],["seem","seem to understand"],
      ["want","want to improve"],["would like","would like to travel"]
    ]},
    {t:"ex", items:[
      {en:"I <em>managed to finish</em> the assignment on time.", vi:"Tôi đã xoay xở hoàn thành bài đúng hạn."},
      {en:"She <em>refused to answer</em> the question.", vi:"Cô ấy từ chối trả lời."}
    ]},
    {t:"h4", text:"To-infinitive chỉ mục đích"},
    {t:"ex", items:[{en:"He went to the library <em>to borrow</em> a book.", vi:"Anh ấy đến thư viện để mượn sách."}]},
    {t:"h4", text:"Tính từ + to-infinitive"},
    {t:"ex", items:[{en:"This question is difficult <em>to answer</em>.", vi:"Câu hỏi này khó trả lời."}]}
   ]},
 { h:"4.5. Bare infinitive — động từ nguyên mẫu không to",
   blocks:[
    {t:"h4", text:"A. Sau động từ khuyết thiếu"},
    {t:"ex", items:[{en:"She can <em>swim</em>. / You should <em>study</em>.", vi:"Không dùng 'can to swim'."}]},
    {t:"h4", text:"B. Sau LET và MAKE"},
    {t:"formula", text:"let / make + object + V"},
    {t:"ex", items:[
      {en:"Let me <em>explain</em>.", vi:"Hãy để tôi giải thích."},
      {en:"The teacher made us <em>rewrite</em> the paragraph.", vi:"Giáo viên bắt chúng tôi viết lại đoạn văn."}
    ]},
    {t:"note", text:"Ở thể bị động: <b>be made + to-infinitive</b> → <i>We were made <b>to rewrite</b> the paragraph.</i>"},
    {t:"h4", text:"C. Sau động từ chỉ giác quan"},
    {t:"ex", items:[
      {en:"I saw him <em>cross</em> the road.", vi:"Tôi thấy anh ấy băng qua đường — hành động trọn vẹn."},
      {en:"I saw him <em>crossing</em> the road.", vi:"Tôi thấy anh ấy đang băng qua đường — hành động đang diễn ra."}
    ]},
    {t:"h4", text:"D. HELP — dùng được cả hai dạng"},
    {t:"ex", items:[
      {en:"She helped me <em>carry</em> the bags. = She helped me <em>to carry</em> the bags.", vi:"Cả hai đều đúng."}
    ]}
   ]},
 { h:"4.6. Verb + object + to-infinitive",
   blocks:[
    {t:"formula", text:"Verb + object + to + V"},
    {t:"p", text:"Động từ thường gặp: advise, allow, ask, encourage, expect, invite, need, persuade, remind, tell, want, warn."},
    {t:"ex", items:[
      {en:"My teacher advised me <em>to practise</em> more.", vi:"Giáo viên khuyên tôi luyện tập thêm."},
      {en:"I reminded her <em>to bring</em> the book.", vi:"Tôi nhắc cô ấy mang theo sách."}
    ]},
    {t:"note", text:"<b>suggest</b> không theo mẫu này: <i>She suggested me to go</i> ✗ → <b>She suggested going by bus.</b> ✓ hoặc <b>She suggested that I go by bus.</b> ✓"}
   ]},
 { h:"4.7. ⚠️ Động từ đổi nghĩa: V-ing vs to-V",
   blocks:[
    {t:"table", head:["Cấu trúc","Nghĩa","Ví dụ"], rows:[
      ["stop + V-ing","dừng hành động đang làm","He stopped smoking. (bỏ thuốc)"],
      ["stop + to V","dừng lại để làm việc khác","He stopped to smoke. (dừng lại để hút)"],
      ["remember + V-ing","nhớ đã làm gì","I remember meeting her."],
      ["remember + to V","nhớ phải làm gì","Remember to call your mother."],
      ["forget + V-ing","quên rằng đã làm gì","I’ll never forget visiting Paris."],
      ["forget + to V","quên thực hiện việc cần làm","I forgot to lock the door."],
      ["try + V-ing","thử một phương pháp","Try restarting your computer."],
      ["try + to V","cố gắng làm gì","I tried to open the door, but it was locked."],
      ["regret + V-ing","hối tiếc về việc đã xảy ra","I regret telling him the secret."],
      ["regret + to V","lấy làm tiếc khi phải thông báo","We regret to inform you that…"],
      ["go on + V-ing","tiếp tục cùng một hành động","She went on talking."],
      ["go on + to V","chuyển sang hành động tiếp theo","She went on to explain the next point."],
      ["mean + V-ing","đồng nghĩa với việc","Being a teacher means working with students."],
      ["mean + to V","có ý định làm gì","I meant to call you."],
      ["need + to V","chủ ngữ cần làm gì","I need to wash my clothes."],
      ["need + V-ing","chủ ngữ cần được làm (bị động)","My clothes need washing."]
    ]}
   ]},
 { h:"4.8. Perfect gerund và Passive gerund",
   blocks:[
    {t:"table", head:["Dạng","Cấu trúc","Ví dụ"], rows:[
      ["Perfect gerund","having + V3/ed","He admitted <b>having made</b> a mistake."],
      ["Passive gerund","being + V3/ed","He dislikes <b>being criticised</b>."],
      ["Perfect passive gerund","having been + V3/ed","He denied <b>having been warned</b>."]
    ]},
    {t:"p", text:"Perfect gerund nhấn mạnh hành động đã xảy ra <b>trước</b> hành động/sự việc được đề cập."}
   ]}
],
quiz:[

 {q:"He stopped ___ last year. (bỏ thuốc)", o:["to smoke","smoking","smoke","smoked"], a:1, e:"stop + V-ing = dừng hẳn hành động."},

{

 { h:"5.5. ⚠️ Phân biệt tính từ V-ing và V3/ed",

/* ---------------------------------- 6 ---------------------------------- */
{
id:"t6", num:6, icon:"🔗",
title:"Relative Clauses", vi:"Mệnh đề quan hệ",
intro:"Mệnh đề quan hệ bổ sung thông tin cho danh từ đứng trước. Phân biệt xác định / không xác định là điểm mấu chốt — vì nó quyết định dấu phẩy, việc dùng 'that' và việc lược bỏ đại từ.",
sections:[
 { h:"6.1. Hai loại mệnh đề quan hệ",
   blocks:[
    {t:"h4", text:"A. Defining — mệnh đề xác định"},
    {t:"p", text:"Cung cấp thông tin <b>cần thiết</b> để xác định đối tượng. <b>Không</b> dùng dấu phẩy."},
    {t:"ex", items:[
      {en:"The student <em>who won the competition</em> is my friend.", vi:"Học sinh đã thắng cuộc thi là bạn tôi."},
      {en:"The book <em>that I bought yesterday</em> is interesting.", vi:"Quyển sách tôi mua hôm qua rất thú vị."}
    ]},
    {t:"h4", text:"B. Non-defining — mệnh đề không xác định"},
    {t:"p", text:"Cung cấp thông tin <b>bổ sung</b>. Đối tượng đã được xác định. <b>Dùng dấu phẩy</b>."},
    {t:"ex", items:[
      {en:"My brother<em>, who lives in Hanoi,</em> is a teacher.", vi:"Anh trai tôi, người sống ở Hà Nội, là giáo viên."},
      {en:"London<em>, which is the capital of England,</em> attracts many tourists.", vi:"London, thủ đô nước Anh, thu hút nhiều khách du lịch."}
    ]},
    {t:"note", text:"Trong mệnh đề <b>không xác định</b>, KHÔNG dùng <b>that</b> thay cho who/which."},
    {t:"h4", text:"C. So sánh"},
    {t:"table", head:["Defining","Non-defining"], rows:[
      ["Thông tin cần thiết để xác định đối tượng","Thông tin bổ sung"],
      ["Không có dấu phẩy","Có dấu phẩy"],
      ["Có thể dùng that","Không dùng that"],
      ["Có thể lược bỏ đại từ quan hệ làm tân ngữ","Không lược bỏ đại từ quan hệ"]
    ]},
    {t:"ex", items:[
      {en:"My sisters <em>who live in Hanoi</em> are teachers.", vi:"Những chị/em gái sống ở Hà Nội là giáo viên (chỉ một số người)."},
      {en:"My sisters<em>, who live in Hanoi,</em> are teachers.", vi:"Các chị/em gái của tôi, vốn sống ở Hà Nội, đều là giáo viên (bổ sung thông tin)."}
    ]},
    {t:"note", text:"Dấu phẩy có thể <b>làm thay đổi ý nghĩa câu</b>."}
   ]},
 { h:"6.2. WHO, WHOM, WHOSE, WHICH, THAT",
   blocks:[
    {t:"table", head:["Đại từ","Dùng cho","Ví dụ"], rows:[
      ["who","người (chủ ngữ hoặc tân ngữ)","The woman who teaches us is kind."],
      ["whom","người ở vị trí tân ngữ (trang trọng)","The person whom I invited could not come."],
      ["whose","sở hữu + danh từ","The student whose father is a doctor won the prize."],
      ["which","vật, động vật","The phone which is on the desk is mine."],
      ["that","người/vật trong mệnh đề xác định","The book that I borrowed is missing."]

    {t:"h4", text:"WHOM — văn phong trang trọng"},

      {en:"The woman <em>who I spoke to</em> was helpful.", vi:"Cách nói tự nhiên hơn trong giao tiếp."}

    {t:"h4", text:"WHICH chỉ cả một ý / sự việc"},
    {t:"ex", items:[{en:"He missed the bus, <em>which</em> made him late.", vi:"Anh ấy lỡ xe buýt, điều đó khiến anh ấy đến muộn."}]}
   ]},
 { h:"6.3. Relative adverbs — WHERE, WHEN, WHY",
   blocks:[
    {t:"table", head:["Từ","Dùng khi","Ví dụ"], rows:[

      ["when","danh từ chỉ thời gian","I remember the day <b>when</b> we first met."],

 { h:"6.4. Đại từ quan hệ làm CHỦ NGỮ và TÂN NGỮ",

    ]},
    {t:"note", text:"Không lược bỏ đại từ quan hệ trong mệnh đề <b>không xác định</b>: <i>My car, which I bought last year, is reliable.</i> ✓"}

 { h:"6.5. Giới từ trong mệnh đề quan hệ",

    {t:"h4", text:"A. Giới từ đứng trước whom / which (trang trọng)"},

 { h:"6.6. Mệnh đề quan hệ với lượng từ",
   blocks:[
    {t:"table", head:["Cấu trúc","Nghĩa"], rows:[

/* ---------------------------------- 7 ---------------------------------- */
{
id:"t7", num:7, icon:"✂️",
title:"Reduced Relative Clauses", vi:"Mệnh đề quan hệ rút gọn",
intro:"Rút gọn mệnh đề quan hệ giúp câu ngắn gọn hơn bằng cách lược bỏ đại từ quan hệ và trợ động từ khi cấu trúc cho phép. Nguyên tắc cốt lõi: xác định quan hệ CHỦ ĐỘNG hay BỊ ĐỘNG.",
sections:[
 { h:"7.1. Rút gọn bằng V-ing (quan hệ chủ động)",
   blocks:[
    {t:"formula", text:"Noun + V-ing"},
    {t:"ex", items:[
      {en:"The woman <em>who is talking</em> to the teacher is my mother. → The woman <em>talking</em> to the teacher is my mother.", vi:"Người phụ nữ đang nói chuyện với giáo viên là mẹ tôi."},
      {en:"People <em>who live</em> in rural areas… → People <em>living</em> in rural areas…", vi:"Những người sống ở nông thôn…"},
      {en:"The man <em>who works</em> at the bank is my uncle. → The man <em>working</em> at the bank is my uncle.", vi:"Người đàn ông làm ở ngân hàng là chú tôi."}
    ]}
   ]},
 { h:"7.2. Rút gọn bằng V3/ed (quan hệ bị động)",
   blocks:[
    {t:"formula", text:"Noun + V3/ed"},
    {t:"ex", items:[
      {en:"The books <em>which were written</em> by Orwell are famous. → The books <em>written</em> by Orwell are famous.", vi:"Những cuốn sách được Orwell viết rất nổi tiếng."},
      {en:"The documents <em>that were submitted</em> yesterday have been checked. → The documents <em>submitted</em> yesterday have been checked.", vi:"Những tài liệu nộp hôm qua đã được kiểm tra."},
      {en:"The people <em>who were injured</em> in the accident were taken to hospital. → The people <em>injured</em> in the accident…", vi:"Những người bị thương trong tai nạn đã được đưa đến bệnh viện."}
    ]}
   ]},
 { h:"7.3. Rút gọn bằng to-infinitive",
   blocks:[
    {t:"p", text:"Dùng sau số thứ tự, từ chỉ thứ tự, <b>the only / the first / the last / the next</b>, hoặc khi diễn đạt mục đích, khả năng, việc cần thực hiện."},
    {t:"formula", text:"the first / last / only / next + noun + to + V"},
    {t:"ex", items:[
      {en:"She was the first person <em>who arrived</em>. → She was the first person <em>to arrive</em>.", vi:"Cô ấy là người đầu tiên đến."},
      {en:"He was the only student <em>who answered</em> the question. → He was the only student <em>to answer</em> the question.", vi:"Anh ấy là học sinh duy nhất trả lời câu hỏi."},
      {en:"I have a lot of homework <em>that I need to finish</em>. → I have a lot of homework <em>to finish</em>.", vi:"Tôi có nhiều bài tập cần hoàn thành."}
    ]},
    {t:"note", text:"Không phải mọi mệnh đề quan hệ đều chuyển được sang to-infinitive mà giữ nguyên nghĩa."}
   ]},
 { h:"7.4. Rút gọn bằng cụm giới từ hoặc tính từ",
   blocks:[
    {t:"ex", items:[
      {en:"The students <em>who are responsible</em> for the project… → The students <em>responsible</em> for the project…", vi:"Những sinh viên chịu trách nhiệm dự án…"},
      {en:"The people <em>who are interested</em> in the course… → The people <em>interested</em> in the course…", vi:"Những người quan tâm khóa học…"},
      {en:"The house <em>which is near</em> the river… → The house <em>near</em> the river…", vi:"Ngôi nhà gần sông…"}
    ]}
   ]},
 { h:"7.5. Bảng xác định dạng rút gọn",
   blocks:[
    {t:"table", head:["Quan hệ với danh từ","Dạng rút gọn","Ví dụ"], rows:[
      ["Chủ động, đang thực hiện","V-ing","the boy running outside"],
      ["Bị động, chịu tác động","V3/ed","the window broken yesterday"],
      ["Đầu tiên / cuối cùng / duy nhất","to-infinitive","the first person to arrive"],
      ["Trạng thái hoặc đặc điểm","Tính từ / cụm giới từ","students interested in music"]
    ]},
    {t:"h4", text:"Lỗi thường gặp"},
    {t:"table", head:["Đúng ✓","Sai ✗"], rows:[
      ["The man working here is my uncle.","The man worked here is my uncle."],
      ["The letter written yesterday is on the desk.","The letter writing yesterday is on the desk."]
    ]},
    {t:"note", text:"Việc rút gọn phải giữ đúng quan hệ <b>chủ động / bị động</b> và ý nghĩa thời gian — không chỉ xóa đại từ quan hệ rồi bỏ tùy ý các từ khác."}
   ]}
],
quiz:[
 {q:"The woman ___ to the teacher is my mother.", o:["talks","talking","talked","to talk"], a:1, e:"Quan hệ chủ động → V-ing."},
 {q:"The books ___ by Orwell are famous.", o:["writing","wrote","written","to write"], a:2, e:"Quan hệ bị động → V3/ed."},
 {q:"She was the first person ___.", o:["arriving","arrived","to arrive","arrive"], a:2, e:"Sau the first + noun → to-infinitive."},
 {q:"The people ___ in the accident were taken to hospital.", o:["injuring","injured","to injure","injure"], a:1, e:"Người bị thương → quan hệ bị động → V3/ed."},
 {q:"Câu nào ĐÚNG?", o:["The man worked here is my uncle.","The man working here is my uncle.","The man work here is my uncle.","The man to work here is my uncle."], a:1, e:"'The man' chủ động làm việc → working."},
 {q:"The students ___ for the project must attend the meeting.", o:["who are responsible","responsible","responsibly","responsibility"], a:1, e:"Rút gọn bằng cụm tính từ: responsible for."}
]

{
id:"t9", num:9, icon:"💬",
title:"Reported Speech", vi:"Câu tường thuật",
intro:"Thuật lại lời nói, câu hỏi, yêu cầu mà không lặp lại nguyên văn. Ba điểm cần nắm: lùi thì, đổi đại từ/trạng từ, và cấu trúc riêng cho từng loại câu.",

 { h:"9.1. Reported statements — Tường thuật câu kể",
   blocks:[
    {t:"formula", text:"S + said (that) + clause"},
    {t:"formula", text:"S + told + object + (that) + clause"},
    {t:"table", head:["SAY","TELL"], rows:[
      ["say something","tell somebody something"],
      ["say that + clause","tell somebody that + clause"],
      ["say to somebody","tell somebody"]
    ]},
    {t:"ex", items:[
      {en:"Direct: He said, “I am busy.” → Reported: He said (that) he <em>was</em> busy.", vi:"Anh ấy nói anh ấy bận."},
      {en:"Direct: She said to me, “I need your help.” → Reported: She <em>told me</em> (that) she <em>needed</em> my help.", vi:"Cô ấy nói cô ấy cần sự giúp đỡ của tôi."}
    ]},

   ]},
 { h:"9.2. Lùi thì (backshift)",
   blocks:[
    {t:"p", text:"Khi động từ tường thuật ở quá khứ, thì trong lời nói trực tiếp thường lùi một bậc."},
    {t:"table", head:["Direct","Reported"], rows:[
      ["Present simple","Past simple"],
      ["Present continuous","Past continuous"],
      ["Present perfect","Past perfect"],
      ["Past simple","Past perfect"],
      ["Past continuous","Past perfect continuous"],
      ["Past perfect","Giữ nguyên"],
      ["will","would"],
      ["can","could"],
      ["may","might"],
      ["must","had to (khi diễn tả nghĩa vụ trong quá khứ)"]
    ]},
    {t:"ex", items:[
      {en:"“I work here.” → He said he <em>worked</em> there.", vi:"Anh ấy nói anh ấy làm việc ở đó."},
      {en:"“I have finished.” → He said he <em>had finished</em>.", vi:"Anh ấy nói anh ấy đã xong."},
      {en:"“I will help you.” → She said she <em>would help</em> me.", vi:"Cô ấy nói cô ấy sẽ giúp tôi."}

    {t:"table", head:["Direct","Reported"], rows:[

 { h:"9.4. Reported questions — Tường thuật câu hỏi",
   blocks:[

    {t:"formula", text:"ask + object + if / whether + S + V"},
    {t:"ex", items:[
      {en:"“Do you like English?” → She asked me <em>if I liked</em> English.", vi:"Cô ấy hỏi tôi có thích tiếng Anh không."},
      {en:"“Have you finished your homework?” → He asked me <em>whether I had finished</em> my homework.", vi:"Anh ấy hỏi tôi đã làm xong bài chưa."}
    ]},
    {t:"h4", text:"B. Wh-questions"},
    {t:"formula", text:"ask + object + wh-word + S + V"},
    {t:"ex", items:[
      {en:"“Where do you live?” → She asked me <em>where I lived</em>.", vi:"Cô ấy hỏi tôi sống ở đâu."},
      {en:"“Why are you crying?” → He asked me <em>why I was crying</em>.", vi:"Anh ấy hỏi tôi tại sao khóc."}
    ]},
    {t:"h4", text:"C. ⚠️ Không đảo trợ động từ"},
    {t:"table", head:["Đúng ✓","Sai ✗"], rows:[
      ["She asked me where I was.","She asked me where was I."],
      ["He asked me if I liked coffee.","He asked me did I like coffee."]
    ]},
    {t:"note", text:"Câu hỏi tường thuật kết thúc bằng <b>dấu chấm</b>, không phải dấu hỏi."}
   ]},
 { h:"9.5. Reported requests — Tường thuật lời yêu cầu",
   blocks:[
    {t:"formula", text:"ask / tell + object + to + V"},
    {t:"formula", text:"ask / tell + object + not to + V"},
    {t:"ex", items:[
      {en:"“Please help me.” → She <em>asked me to help</em> her.", vi:"Cô ấy yêu cầu tôi giúp."},
      {en:"“Don’t touch that.” → He <em>told me not to touch</em> that.", vi:"Anh ấy bảo tôi đừng chạm vào đó."}
    ]},
    {t:"h4", text:"Các động từ tường thuật khác"},
    {t:"table", head:["Động từ","Cấu trúc","Ví dụ"], rows:[
      ["advise","advise + O + to V","He advised me to rest."],
      ["warn","warn + O + not to V","She warned me not to go there."],
      ["remind","remind + O + to V","He reminded me to study."],
      ["encourage","encourage + O + to V","They encouraged her to apply."],
      ["invite","invite + O + to V","She invited me to join them."],
      ["order","order + O + to V","The officer ordered him to stop."],
      ["persuade","persuade + O + to V","I persuaded him to stay."]
    ]},
    {t:"note", text:"“Could you open the window?” có thể là <b>lời yêu cầu</b> → <i>She asked me to open the window.</i> Hoặc là <b>câu hỏi</b> → <i>She asked if I could open the window.</i> Cách tường thuật phụ thuộc ý định giao tiếp."}
   ]},
 { h:"9.6. Động từ tường thuật + cấu trúc",
   blocks:[
    {t:"table", head:["Cấu trúc","Ví dụ"], rows:[
      ["admit + V-ing","He admitted making a mistake."],
      ["deny + V-ing","She denied taking the money."],
      ["suggest + V-ing","He suggested going by bus."],
      ["offer + to V","She offered to help."],
      ["promise + to V","He promised to return."],
      ["refuse + to V","She refused to answer."],
      ["warn + O + not to V","He warned me not to touch it."],
      ["accuse + O + of + V-ing","They accused him of lying."],
      ["apologise for + V-ing","She apologised for being late."],
      ["congratulate + O + on + V-ing","I congratulated him on passing."]
    ]}
   ]},
 { h:"9.7. Lỗi thường gặp",
   blocks:[
    {t:"table", head:["Sai ✗","Đúng ✓"], rows:[
      ["He said me that he was tired.","He told me that he was tired."],
      ["She asked where was I.","She asked where I was."],
      ["He told me don’t go.","He told me not to go."],
      ["She suggested me to study harder.","She suggested that I study harder. / She suggested studying harder."]
    ]}
   ]}
],
quiz:[
 {q:"Mary said she ___ tired.", o:["is","was","were","be"], a:1, e:"Lùi thì: am → was."},
 {q:"He asked me where I ___.", o:["live","lived","do live","living"], a:1, e:"Lùi thì + trật tự câu kể (không đảo trợ động từ)."},
 {q:"She asked me ___ I liked coffee.", o:["that","if","what","do"], a:1, e:"Yes/No question → if / whether."},
 {q:"He told me ___ touch that.", o:["don’t","not to","to not","no to"], a:1, e:"Yêu cầu phủ định → not to + V."},
 {q:"She suggested ___ by bus.", o:["to go","going","go","me to go"], a:1, e:"suggest + V-ing (không dùng suggest sb to do)."},
 {q:"Câu nào ĐÚNG?", o:["She asked where was I.","She asked where I was.","She asked me where was I.","She asked me where I was living now?"], a:1, e:"Câu hỏi tường thuật dùng trật tự câu kể và dấu chấm."},
 {q:"He said he ___ finished his work.", o:["has","have","had","having"], a:2, e:"Present perfect → Past perfect."}
]

/* ---------------------------------- 10 --------------------------------- */
{
id:"t10", num:10, icon:"🔀",
title:"Conjunctions", vi:"Liên từ",
intro:"Liên từ kết nối từ, cụm từ hoặc mệnh đề. Ba nhóm chính: đẳng lập (FANBOYS), phụ thuộc và tương quan. Cần chú ý cả cấu trúc lẫn dấu câu.",
sections:[
 { h:"10.1. Coordinating conjunctions — FANBOYS",
   blocks:[
    {t:"table", head:["Liên từ","Nghĩa","Ví dụ"], rows:[
      ["For","vì (trang trọng)","He stayed home, for he was ill."],
      ["And","và","She sings and dances."],
      ["Nor","cũng không","He didn’t call, nor did he write."],
      ["But","nhưng","I was tired, but I continued."],
      ["Or","hoặc","You can walk or take a bus."],
      ["Yet","tuy nhiên","It was difficult, yet she succeeded."],
      ["So","vì vậy","It was raining, so we stayed home."]
    ]},
    {t:"h4", text:"Quy tắc dấu câu"},
    {t:"p", text:"Khi nối <b>hai mệnh đề độc lập</b>, đặt dấu phẩy trước liên từ:"},
    {t:"ex", items:[
      {en:"I was tired<em>,</em> but I finished my work.", vi:"Tôi mệt nhưng vẫn hoàn thành công việc."},
      {en:"She studied hard<em>,</em> so she passed the exam.", vi:"Cô ấy học chăm nên đã đỗ."}
    ]},
    {t:"p", text:"Khi chỉ nối <b>từ / cụm từ</b>, thường không cần dấu phẩy: <i>tea and coffee · tired but happy · by bus or by train</i>"}
   ]},
 { h:"10.2. Subordinating conjunctions — Liên từ phụ thuộc",
   blocks:[
    {t:"h4", text:"A. Nguyên nhân"},
    {t:"table", head:["Liên từ","Ví dụ"], rows:[
      ["because","I stayed home because I was ill."],
      ["since","Since it was late, we went home."],
      ["as","As it was raining, we took a taxi."]
    ]},
    {t:"p", text:"<b>Because</b> nhấn mạnh lý do trực tiếp; <b>since</b> và <b>as</b> giới thiệu lý do đã biết hoặc ít được nhấn mạnh hơn."},
    {t:"h4", text:"B. Tương phản / nhượng bộ"},
    {t:"ex", items:[
      {en:"<em>Although</em> he was tired, he continued working.", vi:"Mặc dù mệt, anh ấy vẫn tiếp tục làm việc."},
      {en:"<em>Even though</em> it was expensive, she bought it.", vi:"Mặc dù đắt, cô ấy vẫn mua."},
      {en:"I prefer studying alone, <em>whereas</em> my brother likes studying in groups.", vi:"Tôi thích học một mình, trong khi anh tôi thích học nhóm."}
    ]},
    {t:"note", text:"Không dùng <b>although</b> và <b>but</b> trong cùng một cặp mệnh đề: <i>Although it was raining, but we went out.</i> ✗"},
    {t:"h4", text:"C. Điều kiện"},
    {t:"table", head:["Liên từ","Nghĩa"], rows:[
      ["if","nếu"],["unless","trừ khi, nếu không"],["provided/providing that","với điều kiện là"],
      ["as long as","miễn là"],["in case","phòng khi"]
    ]},
    {t:"ex", items:[
      {en:"You won’t pass <em>unless</em> you work harder.", vi:"Bạn sẽ không đỗ trừ khi học chăm hơn."},
      {en:"You can borrow my laptop <em>as long as</em> you return it tomorrow.", vi:"Bạn có thể mượn laptop miễn là trả vào ngày mai."},
      {en:"Take an umbrella <em>in case</em> it rains.", vi:"Mang ô phòng khi trời mưa."}
    ]},
    {t:"h4", text:"D. Thời gian"},
    {t:"table", head:["Liên từ","Nghĩa"], rows:[
      ["when","khi"],["while","trong khi"],["before","trước khi"],["after","sau khi"],
      ["until / till","cho đến khi"],["as soon as","ngay khi"],["once","một khi"],
      ["whenever","bất cứ khi nào"],["by the time","vào lúc"]
    ]},
    {t:"ex", items:[
      {en:"<em>As soon as</em> she arrived, we started dinner.", vi:"Ngay khi cô ấy đến, chúng tôi bắt đầu ăn tối."},
      {en:"Wait here <em>until</em> I come back.", vi:"Đợi ở đây cho đến khi tôi quay lại."}
    ]},
    {t:"note", text:"Nói về tương lai, mệnh đề thời gian dùng <b>hiện tại đơn</b>: <i>I’ll call you when I <b>arrive</b>.</i> (không dùng <i>will arrive</i>)"}
   ]},
 { h:"10.3. Correlative conjunctions — Liên từ tương quan",
   blocks:[
    {t:"table", head:["Cặp liên từ","Nghĩa"], rows:[
      ["both…and","cả…và"],["either…or","hoặc…hoặc"],["neither…nor","không…cũng không"],
      ["not only…but also","không những…mà còn"],["whether…or","liệu…hay"],["rather…than","thay vì"]
    ]},
    {t:"ex", items:[
      {en:"<em>Both</em> my sister <em>and</em> my brother speak English.", vi:"Cả chị và anh tôi đều nói tiếng Anh."},
      {en:"<em>Neither</em> John <em>nor</em> Peter was present.", vi:"Cả John và Peter đều không có mặt."},
      {en:"She is <em>not only</em> intelligent <em>but also</em> hardworking.", vi:"Cô ấy không những thông minh mà còn chăm chỉ."}
    ]},
    {t:"h4", text:"Quy tắc song song (parallel structure)"},
    {t:"table", head:["Đúng ✓","Sai ✗"], rows:[
      ["She likes reading and writing.","She likes reading and to write."]
    ]},
    {t:"h4", text:"Hòa hợp chủ ngữ – động từ"},
    {t:"ex", items:[
      {en:"Either my brother or my parents <em>are</em> coming.", vi:"Động từ hòa hợp với chủ ngữ gần nhất."},
      {en:"Either my parents or my brother <em>is</em> coming.", vi:"Động từ hòa hợp với chủ ngữ gần nhất."}
    ]}
   ]},
 { h:"10.4. Liên từ vs trạng từ liên kết",
   blocks:[
    {t:"p", text:"<b>however, therefore, moreover, nevertheless, consequently</b> là <b>trạng từ liên kết</b>, không phải liên từ đẳng lập."},
    {t:"table", head:["Đúng ✓","Sai ✗"], rows:[
      ["It was raining. However, we went out.","It was raining, however we went out."],
      ["It was raining; however, we went out.",""],
      ["It was raining, but we went out.",""]
    ]}
   ]}
],
quiz:[
 {q:"___ it was raining, we went out.", o:["Although","But","However","So"], a:0, e:"Mệnh đề nhượng bộ mở đầu bằng Although."},
 {q:"Câu nào SAI?", o:["Although it was raining, we went out.","It was raining, but we went out.","Although it was raining, but we went out.","It was raining. However, we went out."], a:2, e:"Không dùng Although và but trong cùng một cặp mệnh đề."},
 {q:"I’ll call you when I ___.", o:["will arrive","arrive","arrived","am arriving"], a:1, e:"Mệnh đề thời gian nói về tương lai dùng hiện tại đơn."},
 {q:"Neither John nor Peter ___ present.", o:["were","was","are","be"], a:1, e:"Động từ hòa hợp với chủ ngữ gần nhất (Peter → was)."},
 {q:"You won’t pass ___ you work harder.", o:["if","unless","although","so"], a:1, e:"UNLESS = trừ khi / nếu không."},
 {q:"It was raining, ___ we stayed home.", o:["but","so","although","however"], a:1, e:"Kết quả → SO (liên từ đẳng lập)."},
 {q:"She is not only intelligent ___ hardworking.", o:["and","but also","or","nor"], a:1, e:"Cặp tương quan not only…but also."}
]
},
/* ---------------------------------- 11 --------------------------------- */
{
id:"t11", num:11, icon:"🎯",
title:"Purpose Clauses", vi:"Mệnh đề chỉ mục đích",
intro:"Mệnh đề chỉ mục đích giải thích một hành động được thực hiện nhằm đạt được mục tiêu gì. Điểm mấu chốt: phân biệt cấu trúc dùng động từ nguyên mẫu với cấu trúc dùng mệnh đề đầy đủ.",
sections:[
 { h:"11.1. TO + INFINITIVE",
   blocks:[
    {t:"formula", text:"S + V + to + V"},
    {t:"ex", items:[
      {en:"I went to the library <em>to study</em>.", vi:"Tôi đến thư viện để học."},
      {en:"She works hard <em>to support</em> her family.", vi:"Cô ấy làm việc chăm chỉ để nuôi gia đình."},
      {en:"He called me <em>to ask</em> for help.", vi:"Anh ấy gọi tôi để nhờ giúp."}
    ]},
    {t:"h4", text:"Phủ định mục đích"},
    {t:"table", head:["Cấu trúc","Ví dụ"], rows:[
      ["in order not to + V","He whispered <b>in order not to</b> wake the baby."],
      ["so as not to + V","She left early <b>so as not to</b> miss the bus."]
    ]},
    {t:"note", text:"<i>I hurried not to be late.</i> kém tự nhiên hơn — nên dùng <b>so as not to be late</b> / <b>in order not to be late</b>."}
   ]},
 { h:"11.2. IN ORDER TO và SO AS TO",
   blocks:[
    {t:"formula", text:"S + V + in order to / so as to + V"},
    {t:"ex", items:[
      {en:"I practise every day <em>in order to</em> improve my pronunciation.", vi:"Tôi luyện tập mỗi ngày để cải thiện phát âm."},
      {en:"He saved money <em>so as to</em> buy a new laptop.", vi:"Anh ấy tiết kiệm tiền để mua laptop mới."}
    ]},
    {t:"table", head:["Cấu trúc","Đặc điểm"], rows:[
      ["to + V","Phổ biến, ngắn gọn"],
      ["in order to + V","Nhấn mạnh mục đích, trang trọng hơn"],
      ["so as to + V","Thường gặp trong văn viết, trang trọng"]
    ]},
    {t:"p", text:"Ba cấu trúc có thể thay thế nhau trong nhiều câu mà không đổi nghĩa chính."}
   ]},
 { h:"11.3. SO THAT + MỆNH ĐỀ",
   blocks:[
    {t:"formula", text:"S + V + so that + S + can / could / will / would + V"},
    {t:"ex", items:[
      {en:"I speak slowly <em>so that</em> everyone <em>can understand</em> me.", vi:"Tôi nói chậm để mọi người có thể hiểu tôi."},
      {en:"She saved money <em>so that</em> she <em>could buy</em> a laptop.", vi:"Cô ấy tiết kiệm tiền để có thể mua laptop."},
      {en:"I’ll write down the instructions <em>so that</em> you <em>won’t forget</em> them.", vi:"Tôi sẽ ghi lại hướng dẫn để bạn không quên."}
    ]},
    {t:"table", head:["Ngữ cảnh","Modal thường gặp"], rows:[
      ["Mục đích ở hiện tại","can, may"],
      ["Mục đích trong quá khứ","could, might"],
      ["Mục đích hướng tới tương lai","will, can"],
      ["Quá khứ có tính tương lai","would, could"]
    ]}
   ]},
 { h:"11.4. IN ORDER THAT",
   blocks:[
    {t:"p", text:"Trang trọng hơn <b>so that</b>, đi với một mệnh đề."},
    {t:"ex", items:[
      {en:"The teacher repeated the instructions <em>in order that</em> everyone <em>could understand</em> them.", vi:"Giáo viên nhắc lại hướng dẫn để mọi người có thể hiểu."},
      {en:"The rules were changed <em>in order that</em> more people <em>might participate</em>.", vi:"Các quy định được thay đổi để nhiều người có thể tham gia hơn."}
    ]}
   ]},
 { h:"11.5. ⚠️ Phân biệt TO + V và SO THAT",
   blocks:[
    {t:"table", head:["To + V","So that + clause"], rows:[
      ["Theo sau là động từ nguyên mẫu","Theo sau là chủ ngữ + động từ"],
      ["I study hard to pass.","I study hard so that I can pass."],
      ["She moved closer to see better.","She moved closer so that she could see better."]
    ]},
    {t:"note", text:"Khi <b>hai hành động có chủ thể khác nhau</b>, phải dùng mệnh đề: <i>I spoke loudly <b>so that</b> everyone could hear me.</i> — không viết <i>I spoke loudly to everyone hear me.</i>"}
   ]},
 { h:"11.6. Lỗi thường gặp",
   blocks:[
    {t:"table", head:["Sai ✗","Đúng ✓"], rows:[
      ["I study hard for pass the exam.","I study hard to pass the exam."],
      ["She whispered so that not wake the baby.","She whispered so that she would not wake the baby."],
      ["He saved money so that buy a car.","He saved money so that he could buy a car."]
    ]}
   ]}
],
quiz:[
 {q:"I study hard ___ pass the exam.", o:["for","to","so that","in order"], a:1, e:"TO + V khi cùng chủ thể."},
 {q:"She spoke slowly ___ everyone could understand her.", o:["to","so that","in order to","for"], a:1, e:"Hai chủ thể khác nhau → so that + clause."},
 {q:"He whispered ___ wake the baby.", o:["to not","in order not to","so that not","for not"], a:1, e:"Phủ định mục đích: in order not to / so as not to + V."},
 {q:"I’ll write it down ___ you won’t forget.", o:["to","in order to","so that","for"], a:2, e:"Sau đó là mệnh đề đầy đủ → so that."},
 {q:"Câu nào SAI?", o:["I study hard to pass the exam.","I study hard so that I can pass.","I study hard for pass the exam.","I study hard in order to pass."], a:2, e:"FOR không đi trực tiếp với động từ nguyên mẫu để chỉ mục đích."}
]
},
/* ---------------------------------- 12 --------------------------------- */
{
id:"t12", num:12, icon:"📐",
title:"Result Clauses", vi:"Mệnh đề chỉ kết quả",
intro:"Mệnh đề chỉ kết quả diễn tả kết quả hoặc hệ quả của một hành động, đặc điểm hay tình huống. Trọng tâm: so…that, such…that, too…to, enough…to và biến đổi câu giữa chúng.",
sections:[
 { h:"12.1. SO + ADJECTIVE / ADVERB + THAT",
   blocks:[
    {t:"formula", text:"S + V + so + adj / adv + that + clause"},
    {t:"ex", items:[
      {en:"The exam was <em>so difficult that</em> many students failed.", vi:"Bài thi khó đến mức nhiều học sinh trượt."},
      {en:"He ran <em>so quickly that</em> nobody could catch him.", vi:"Anh ấy chạy nhanh đến mức không ai bắt kịp."},
      {en:"She was <em>so tired that</em> she fell asleep immediately.", vi:"Cô ấy mệt đến mức ngủ thiếp đi ngay."}
    ]},
    {t:"h4", text:"SO MUCH / SO MANY / SO LITTLE / SO FEW"},
    {t:"table", head:["Cấu trúc","Ví dụ"], rows:[
      ["so much + N không đếm được","so much work"],
      ["so many + N đếm được số nhiều","so many people"],
      ["so little + N không đếm được","so little time"],
      ["so few + N đếm được số nhiều","so few opportunities"]
    ]},
    {t:"ex", items:[
      {en:"There were <em>so many people that</em> we couldn’t find seats.", vi:"Có nhiều người đến mức chúng tôi không tìm được chỗ ngồi."},
      {en:"She had <em>so little time that</em> she skipped lunch.", vi:"Cô ấy có ít thời gian đến mức bỏ bữa trưa."}
    ]}
   ]},
 { h:"12.2. SUCH + NOUN PHRASE + THAT",
   blocks:[
    {t:"h4", text:"A. SUCH + A/AN + ADJ + SINGULAR COUNTABLE NOUN"},
    {t:"formula", text:"such + a/an + adj + noun + that + clause"},
    {t:"ex", items:[
      {en:"It was <em>such a difficult exam that</em> many students failed.", vi:"Đó là bài thi khó đến mức nhiều học sinh trượt."},
      {en:"She is <em>such a kind person that</em> everyone likes her.", vi:"Cô ấy tốt bụng đến mức ai cũng quý."}
    ]},
    {t:"h4", text:"B. SUCH + ADJ + PLURAL NOUN"},
    {t:"ex", items:[
      {en:"They were <em>such interesting books that</em> I read them all.", vi:"Đó là những cuốn sách thú vị đến mức tôi đọc hết."}
    ]},
    {t:"h4", text:"C. SUCH + ADJ + UNCOUNTABLE NOUN"},
    {t:"ex", items:[
      {en:"It was <em>such bad weather that</em> we cancelled the trip.", vi:"Thời tiết xấu đến mức chúng tôi hủy chuyến đi."}
    ]}
   ]},
 { h:"12.3. ⚠️ SO và SUCH",
   blocks:[
    {t:"table", head:["SO","SUCH"], rows:[
      ["so + adjective / adverb","such + noun phrase"],
      ["so difficult","such a difficult test"],
      ["so quickly","(không dùng such quickly)"],
      ["so much work","such hard work"]
    ]},
    {t:"ex", items:[
      {en:"The film was <em>so interesting that</em> I watched it twice.", vi:"Bộ phim thú vị đến mức tôi xem hai lần."},
      {en:"It was <em>such an interesting film that</em> I watched it twice.", vi:"Cùng nghĩa, cấu trúc khác."}
    ]},
    {t:"table", head:["Sai ✗","Đúng ✓"], rows:[
      ["It was so a difficult exam.","It was such a difficult exam."],
      ["It was such difficult that…","It was so difficult that…"]
    ]}
   ]},
 { h:"12.4. TOO + ADJECTIVE / ADVERB + TO-INFINITIVE",
   blocks:[
    {t:"formula", text:"S + be + too + adj + to + V"},
    {t:"ex", items:[
      {en:"The box is <em>too heavy to lift</em>.", vi:"Cái hộp quá nặng nên không thể nhấc lên."},
      {en:"He was <em>too tired to continue</em> working.", vi:"Anh ấy quá mệt để tiếp tục làm việc."}
    ]},
    {t:"formula", text:"too + adj + for + object + to + V"},
    {t:"ex", items:[
      {en:"The box is <em>too heavy for me to lift</em>.", vi:"Cái hộp quá nặng để tôi có thể nhấc lên."},
      {en:"The question was <em>too difficult for the students to answer</em>.", vi:"Câu hỏi quá khó để học sinh trả lời."}
    ]},
    {t:"note", text:"<b>too</b> không phải lúc nào cũng tiêu cực: <i>too happy to complain</i> = quá vui nên không phàn nàn."}
   ]},
 { h:"12.5. ADJECTIVE + ENOUGH + TO-INFINITIVE",
   blocks:[
    {t:"formula", text:"adj / adv + enough + to + V"},
    {t:"ex", items:[
      {en:"She is <em>old enough to drive</em>.", vi:"Cô ấy đủ tuổi để lái xe."},
      {en:"He ran <em>fast enough to win</em> the race.", vi:"Anh ấy chạy đủ nhanh để thắng cuộc đua."}
    ]},
    {t:"formula", text:"enough + noun + to + V"},
    {t:"ex", items:[
      {en:"We have <em>enough time to finish</em> the task.", vi:"Chúng ta có đủ thời gian để hoàn thành nhiệm vụ."},
      {en:"She has <em>enough money to buy</em> a laptop.", vi:"Cô ấy có đủ tiền để mua laptop."}
    ]},
    {t:"formula", text:"adj + enough + for + object + to + V"},
    {t:"ex", items:[
      {en:"The room is <em>large enough for everyone to sit</em> comfortably.", vi:"Căn phòng đủ rộng để mọi người ngồi thoải mái."}
    ]}
   ]},
 { h:"12.6. TOO…TO và ENOUGH…TO",
   blocks:[
    {t:"table", head:["TOO…TO","ENOUGH…TO"], rows:[
      ["Quá… nên không thể","Đủ… để có thể"],
      ["too young to drive","old enough to drive"],
      ["too heavy to lift","light enough to lift"],
      ["too difficult to understand","easy enough to understand"]
    ]},
    {t:"ex", items:[
      {en:"He is <em>too young to drive</em>. ↔ He is <em>not old enough to drive</em>.", vi:"Hai câu tương đương về nghĩa."}
    ]},
    {t:"note", text:"Không phải mọi cặp too…to và enough…to đều là phép đổi câu trực tiếp — thường cần đổi tính từ hoặc điều chỉnh ý nghĩa."}
   ]},
 { h:"12.7. Biến đổi câu",
   blocks:[
    {t:"table", head:["Từ","Sang","Ví dụ"], rows:[
      ["SO…THAT","SUCH…THAT","The book was so interesting that… → It was such an interesting book that…"],
      ["TOO…TO","SO…THAT","The tea was too hot to drink. → The tea was so hot that I couldn’t drink it."],
      ["ENOUGH…TO","SO…THAT","She was strong enough to lift the box. → She was so strong that she could lift it."],
      ["TOO…TO","NOT ENOUGH…TO","The child is too young to drive. → The child is not old enough to drive."]
    ]},
    {t:"note", text:"Khi biến đổi câu, chú ý <b>chủ thể hành động</b>, <b>thì của động từ</b> và việc thêm <b>can/could</b> hoặc <b>cannot/could not</b> sao cho giữ nguyên nghĩa."}
   ]},
 { h:"12.8. Phân biệt PURPOSE và RESULT",
   blocks:[
    {t:"table", head:["Purpose — Mục đích","Result — Kết quả"], rows:[
      ["Nêu điều người nói muốn đạt được","Nêu điều thực tế xảy ra do một tình huống"],
      ["to, in order to, so that","so…that, such…that"],
      ["She studied hard to pass.","She studied so hard that she became exhausted."]
    ]},
    {t:"note", text:"Mẹo nhận diện: nếu câu trả lời cho <b>“Why did someone do this?”</b> → mục đích. Nếu câu diễn tả <b>hệ quả do mức độ</b> của một đặc điểm/hành động → kết quả."}
   ]}
],
quiz:[
 {q:"The exam was ___ difficult that many students failed.", o:["such","so","too","enough"], a:1, e:"Trước tính từ đơn → SO."},
 {q:"It was ___ a difficult exam that many students failed.", o:["so","such","too","very"], a:1, e:"Trước cụm danh từ (a + adj + noun) → SUCH."},
 {q:"The box is too heavy ___ lift.", o:["for","to","that","enough"], a:1, e:"too + adj + to + V."},
 {q:"She is old ___ to drive.", o:["too","so","enough","such"], a:2, e:"adj + enough + to V."},
 {q:"The tea was too hot ___.", o:["drink","to drink","drinking","for drink"], a:1, e:"too + adj + to + V."},
 {q:"There were ___ many people that we couldn’t find seats.", o:["such","so","too","very"], a:1, e:"so many + N đếm được số nhiều + that."},
 {q:"Câu nào ĐÚNG?", o:["It was so a difficult exam.","It was such difficult that many failed.","It was such a difficult exam that many failed.","It was too a difficult exam."], a:2, e:"SUCH + a/an + adj + noun + that."}
]
}
];

/* =====================================================================
   STATE & STORAGE
   ===================================================================== */
const LS_KEY = "na021_progress_v1";
const LS_THEME = "na021_theme_v1";

let state = {
  current: TOPICS[0].id,
  progress: load(LS_KEY, {}),
  filter: ""
};

function load(k, dft){ try{ return JSON.parse(localStorage.getItem(k)) || dft; }catch(e){ return dft; } }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state.progress)); }catch(e){} }
function pkey(id){ if(!state.progress[id]) state.progress[id] = {done:false, answers:{}}; return state.progress[id]; }

/* =====================================================================
   RENDER: SIDEBAR
   ===================================================================== */
const $nav = document.getElementById("nav");
const $content = document.getElementById("content");
const $crumb = document.getElementById("crumb");
const $chip  = document.getElementById("topChip");

function renderSidebar(){
  const f = state.filter.trim().toLowerCase();
  $nav.innerHTML = TOPICS.filter(t =>
    !f || t.title.toLowerCase().includes(f) || t.vi.toLowerCase().includes(f) || String(t.num)===f
  ).map(t=>{
    const p = state.progress[t.id];
    const done = p && p.done;
    return `<div class="nav-item ${t.id===state.current?'active':''} ${done?'done':''}" data-id="${t.id}">
      <div class="nav-num">${done?'✓':t.num}</div>
      <div class="nav-txt"><b>${t.title}</b><small>${t.vi}</small></div>
      ${done?'<span class="nav-badge">Học xong</span>':''}
    </div>`;
  }).join("") || `<div style="padding:20px;color:var(--muted);font-size:13px;text-align:center">Không tìm thấy chuyên đề.</div>`;
  updateProgressUI();
}

function updateProgressUI(){
  const done = TOPICS.filter(t => state.progress[t.id] && state.progress[t.id].done).length;
  const pct = Math.round(done/TOPICS.length*100);
  document.getElementById("progTxt").textContent = done + "/" + TOPICS.length;
  document.getElementById("progBar").style.width = pct + "%";
  $chip.textContent = pct + "%";
}

/* =====================================================================
   RENDER: CONTENT
   ===================================================================== */
function blockHTML(b){
  switch(b.t){
    case "p":   return `<p>${b.text}</p>`;
    case "h4":  return `<h4>${b.text}</h4>`;
    case "formula": return `<div class="formula">${b.text}</div>`;
    case "note": return `<div class="note">${b.text}</div>`;
    case "table":
      return `<div style="overflow-x:auto"><table>
        <thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>`;
    case "ex":
      return b.items.map(i=>`<div class="ex"><div class="en">${i.en}</div><div class="vi">${i.vi}</div></div>`).join("");
    default: return "";
  }
}

function renderTopic(id){
  const t = TOPICS.find(x=>x.id===id); if(!t) return;
  state.current = id;
  const p = pkey(id);

  $crumb.innerHTML = `Chuyên đề ${t.num} · <b>${t.title}</b>`;

  const sectionsHTML = t.sections.map(s=>`
    <section class="card">
      <h3>${s.h}</h3>
      ${s.blocks.map(blockHTML).join("")}
    </section>`).join("");

  $content.innerHTML = `
    <div class="topic-head">
      <div class="kicker">Chuyên đề ${String(t.num).padStart(2,"0")} / 12 ${t.icon}</div>
      <h2>${t.title}</h2>
      <div class="vi">${t.vi}</div>
      <p style="color:var(--muted);font-size:14px;max-width:700px">${t.intro}</p>
      <div class="head-actions">
        <button class="btn ${p.done?'ok':'primary'}" id="markBtn">
          ${p.done ? '✓ Đã học xong' : 'Đánh dấu đã học'}
        </button>
        <button class="btn" id="quizJump">✎ Làm bài tập (${t.quiz.length} câu)</button>
      </div>
    </div>
    ${sectionsHTML}
    <div class="quiz-card" id="quizCard">
      <div class="quiz-top">
        <h3>✎ Bài tập củng cố</h3>
        <div class="quiz-score" id="quizScore"></div>
      </div>
      <div class="quiz-body" id="quizBody"></div>
    </div>
  `;

  document.getElementById("markBtn").onclick = ()=>{
    p.done = !p.done; save(); renderSidebar();
    document.getElementById("markBtn").className = "btn " + (p.done?'ok':'primary');
    document.getElementById("markBtn").textContent = p.done ? '✓ Đã học xong' : 'Đánh dấu đã học';
  };
  document.getElementById("quizJump").onclick = ()=>{
    document.getElementById("quizCard").scrollIntoView({behavior:"smooth", block:"start"});
  };

  renderQuiz(t);
  renderSidebar();
  $content.scrollTop = 0;
  window.scrollTo({top:0, behavior:"instant"});
}

/* =====================================================================
   QUIZ
   ===================================================================== */
function renderQuiz(topic){
  const p = pkey(topic.id);
  const body = document.getElementById("quizBody");
  const scoreEl = document.getElementById("quizScore");

  body.innerHTML = topic.quiz.map((q,qi)=>{
    const picked = p.answers[qi];
    const answered = picked !== undefined;
    return `<div class="q" data-q="${qi}">
      <div class="q-text"><span class="qn">${qi+1}</span><span>${q.q}</span></div>
      <div class="opts">
        ${q.o.map((opt,oi)=>{
          let cls = "opt";
          if(answered){
            cls += " locked";
            if(oi===q.a) cls += " correct";
            else if(oi===picked) cls += " wrong";
          }
          return `<button class="${cls}" data-q="${qi}" data-o="${oi}">${String.fromCharCode(65+oi)}. ${opt}</button>`;
        }).join("")}
      </div>
      <div class="explain" ${answered?'':'hidden'}>
        <b>Đáp án:</b> ${String.fromCharCode(65+q.a)}. ${q.o[q.a]} — ${q.e}
      </div>
    </div>`;
  }).join("") + `<div id="quizResult"></div>`;

  body.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>{
      const qi = +btn.dataset.q, oi = +btn.dataset.o;
      if(p.answers[qi] !== undefined) return;
      p.answers[qi] = oi;
      save();
      const qEl = body.querySelector(`.q[data-q="${qi}"]`);
      qEl.querySelectorAll(".opt").forEach((b,i)=>{
        b.classList.add("locked");
        if(i===topic.quiz[qi].a) b.classList.add("correct");
        else if(i===oi) b.classList.add("wrong");
      });
      qEl.querySelector(".explain").hidden = false;
      updateScore(topic, p);
    };
  });

  updateScore(topic, p);
}

function updateScore(topic, p){
  const total = topic.quiz.length;
  const answered = Object.keys(p.answers).length;
  const correct = topic.quiz.reduce((s,q,i)=> s + (p.answers[i]===q.a ? 1 : 0), 0);
  const el = document.getElementById("quizScore");
  if(el) el.textContent = `${correct}/${total} đúng · ${answered}/${total} đã làm`;

  const res = document.getElementById("quizResult");
  if(!res) return;

  if(answered === total){
    const pct = Math.round(correct/total*100);
    let msg = "Cố lên nhé — xem lại lý thuyết rồi thử lại!";
    if(pct >= 80) msg = "Tuyệt vời! Bạn đã nắm rất chắc chuyên đề này. 🎉";
    else if(pct >= 50) msg = "Khá tốt! Ôn lại các câu sai để chắc kiến thức hơn.";
    res.innerHTML = `<div class="result">
      <div class="big">${correct}/${total}</div>
      <div class="msg">${msg}</div>
      <div style="margin-top:12px">
        <button class="btn" id="retryBtn">↺ Làm lại</button>
      </div>
    </div>`;
    document.getElementById("retryBtn").onclick = ()=>{
      p.answers = {}; save(); renderQuiz(topic);
    };
  } else {
    res.innerHTML = "";
  }
}

/* =====================================================================
   EVENTS
   ===================================================================== */
$nav.addEventListener("click", e=>{
  const item = e.target.closest(".nav-item");
  if(!item) return;
  renderTopic(item.dataset.id);
  if(window.innerWidth <= 960) closeSidebar();
});

document.getElementById("search").addEventListener("input", e=>{
  state.filter = e.target.value; renderSidebar();
});

document.getElementById("menuBtn").onclick = ()=>{
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("overlay").classList.add("show");
};
function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}
document.getElementById("overlay").onclick = closeSidebar;

document.getElementById("resetBtn").onclick = ()=>{
  if(confirm("Đặt lại toàn bộ tiến độ học và bài tập?")){
    state.progress = {}; save(); renderTopic(state.current); renderSidebar();
  }
};

/* THEME */
const themeBtn = document.getElementById("themeBtn");
function applyTheme(th){
  document.documentElement.setAttribute("data-theme", th);
  themeBtn.textContent = th === "dark" ? "☀ Sáng" : "🌙 Tối";
  localStorage.setItem(LS_THEME, th);
}
themeBtn.onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
};

/* INIT */
applyTheme(localStorage.getItem(LS_THEME) || "light");
renderTopic(TOPICS[0].id);
</script>
